<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhetorical — Live Ideas</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div id="app">
        <header id="message-banner" class="message-banner show">
            <div class="banner-content">
                <div id="banner-qr-code" class="banner-qr-code" aria-label="QR code to open the chat"></div>
                <div class="banner-copy">
                    <span id="banner-text">WHAT IS YOUR CRITICAL IDEA?</span>
                    <span class="banner-instruction">Scan to open the chat and share your response</span>
                </div>
            </div>
        </header>

        <div id="display-mode-chip" class="mode-chip">
            <span id="mode-text">Mode: IMAGE</span>
        </div>

        <div id="floating-messages" class="floating-messages-container"></div>

        <section id="message-history" class="hidden" aria-label="Message history">
            <div class="history-header">
                <h3>Message History</h3>
                <button id="close-history" aria-label="Close message history">×</button>
            </div>
            <div id="history-content"></div>
        </section>

        <div id="controls">
            <button id="toggle-mode" class="control-btn">Switch to Text Mode</button>
            <button id="show-history" class="control-btn">Show History</button>
            <button id="banner-settings" class="control-btn">Banner Settings</button>
            <div class="control-group">
                <label for="text-color">Text Color</label>
                <input id="text-color" type="color" value="#2F24C1">
            </div>
            <div class="control-group">
                <label for="randomize-colors">Random Colors</label>
                <input id="randomize-colors" type="checkbox">
            </div>
        </div>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Processing message…</p>
        </div>

        <div id="banner-settings-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Banner Settings</h3>
                    <button id="close-banner-settings" class="close-btn" aria-label="Close banner settings">×</button>
                </div>
                <div class="modal-body banner-controls">
                    <div class="form-group">
                        <label for="banner-message-input">Question</label>
                        <textarea id="banner-message-input" maxlength="120" rows="3"></textarea>
                    </div>
                    <div class="form-group inline-group">
                        <div>
                            <label for="banner-text-color">Text color</label>
                            <input type="color" id="banner-text-color" value="#ffffff">
                        </div>
                        <div>
                            <label for="banner-font-size">Text size</label>
                            <select id="banner-font-size">
                                <option value="20">Medium</option>
                                <option value="24" selected>Large</option>
                                <option value="28">Extra Large</option>
                                <option value="32">Huge</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="banner-font-family">Font</label>
                        <select id="banner-font-family">
                            <option value="Orbitron" selected>Orbitron</option>
                            <option value="Rajdhani">Rajdhani</option>
                            <option value="Russo One">Russo One</option>
                            <option value="Inter">Inter</option>
                        </select>
                    </div>
                    <label class="checkbox-label">
                        <input type="checkbox" id="banner-enabled-checkbox" checked>
                        Show banner
                    </label>
                    <div class="banner-actions">
                        <button id="preview-banner" class="action-btn preview-btn">Preview</button>
                        <button id="save-banner" class="action-btn save-btn">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="notification" class="hidden" role="status" aria-live="polite">
            <div class="notification-content">
                <span id="notification-text"></span>
                <button id="close-notification" aria-label="Close notification">×</button>
            </div>
        </div>
    </div>

    <script src="/static/js/scene3d.js"></script>
    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
